gnss_alignment:
  ros__parameters:
    # 消费来自 gnss_rtk_bridge 的标准 /fix 话题
    fix_topic: /fix
    rtk_topic: ''
    rtk_frame_id: gps
    rtk_fix_topic: /fix_from_rtk
    odom_topic: /odometry_horizon
    fix_odom_topic: /fix_odom
    fix_odom_frame_id: gps
    output_frame: world

    # 标定变换结果输出文件（相对文件名自动解析至包内 data/ 目录）
    transform_path: 'd1m_gps_odom_transform.txt'

    # D1M 机器狗四足专用对齐参数（200对运动样本、加权拟合）
    max_time_delta: 0.15
    calibration_pairs: 200
    min_calibration_displacement: 1.0
    max_points: 10000
    use_weighted_fit: true
    fit_iterations: 15
    huber_delta: 2.5
