gnss_alignment:
  ros__parameters:
    fix_topic: /fix
    rtk_topic: ''
    rtk_frame_id: gps
    rtk_fix_topic: /fix_from_rtk
    odom_topic: /odometry_horizon
    fix_odom_topic: /fix_odom
    fix_odom_frame_id: gps
    output_frame: world

    # 标定变换结果输出文件（相对文件名自动解析至包内 data/ 目录）
    transform_path: 'g60_gps_odom_transform.txt'

    # G60 单点伪距定位参数（30对样本，无真实高精方差，使用普通无加权刚体拟合）
    max_time_delta: 0.15
    calibration_pairs: 30
    min_calibration_displacement: 1.0
    max_points: 10000
    use_weighted_fit: false
    fit_iterations: 15
    huber_delta: 2.5
